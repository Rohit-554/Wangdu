name: Deploy Web to Vercel

# Builds the Compose/wasmJs web app and deploys the static output to Vercel
# on every push to main. The GitHub-hosted ubuntu runner already ships an
# Android SDK (ANDROID_HOME is set), which Gradle needs to configure the
# :composeApp module even for the wasm target.

on:
  push:
    branches: [ main ]
  workflow_dispatch: # allows manual runs from the Actions tab

concurrency:
  group: deploy-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build wasmJs production distribution
        run: ./gradlew :composeApp:wasmJsBrowserDistribution --no-daemon

      - name: Deploy to Vercel (production)
        run: |
          npm install --global vercel@latest
          vercel deploy composeApp/build/dist/wasmJs/productionExecutable \
            --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
